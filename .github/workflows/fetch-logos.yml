name: Fetch company logos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4
      - run: python tools/fetch_logos.py
        timeout-minutes: 40
      - run: |
          git config user.name "naya-nivesh-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos && git commit -m "Fetch company logos from official websites" && git push || echo "nothing new"
