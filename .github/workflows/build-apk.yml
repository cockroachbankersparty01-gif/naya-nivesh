name: Build Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android
        run: gradle assembleDebug
      - name: Publish as the latest release (direct download link)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NayaNivesh.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NayaNivesh.apk --title "Naya Nivesh (latest)" \
            --notes "Tap NayaNivesh.apk below to download, then install it. Built $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')."
      - uses: actions/upload-artifact@v4
        with:
          name: naya-nivesh-apk
          path: NayaNivesh.apk
